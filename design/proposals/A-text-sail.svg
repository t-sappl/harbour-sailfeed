    <rect x="59" y="51.5" width="24" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="49" y="63.0" width="34" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="39" y="74.5" width="44" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="29" y="86.0" width="54" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="19" y="97.5" width="64" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="92" y="52" width="10" height="7" rx="3.5" fill="#ffe7df"/>
    <rect x="92" y="63.5" width="18" height="7" rx="3.5" fill="#ffe7df"/>
    <rect x="92" y="75.0" width="26" height="7" rx="3.5" fill="#ffe7df"/>
