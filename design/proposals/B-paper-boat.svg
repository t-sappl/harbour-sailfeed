<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <!-- Proposal B "newspaper boat": a paper boat folded from a printed page, indigo. -->
  <defs>
    <path id="drop" d="M 86 0.6 A 85.4 85.4 0 0 1 171.4 86 A 85.4 85.4 0 0 1 86 171.4 L 10.6 171.4 A 10 10 0 0 1 0.6 161.4 L 0.6 86 A 85.4 85.4 0 0 1 86 0.6 Z"/>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b78e0"/><stop offset="1" stop-color="#2d3794"/>
    </linearGradient>
    <linearGradient id="face" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#5b68d6"/><stop offset="1" stop-color="#3a45a8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.62" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#141a4d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <use href="#drop" fill="url(#rim)"/>
  <g transform="translate(90 82) scale(0.94) translate(-90 -82)">
    <use href="#drop" fill="url(#face)"/>
    <use href="#drop" fill="url(#shine)"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M 34 106 L 138 106 L 120 136 L 52 136 Z" fill="#ffffff"/>
    <path d="M 86 32 L 86 106 L 46 106 Z" fill="#e3e7ff"/>
    <path d="M 86 32 L 126 106 L 86 106 Z" fill="#ffffff"/>
    <g stroke="#5865c9" stroke-width="4.5" stroke-linecap="round">
      <line x1="62" y1="117" x2="110" y2="117"/>
      <line x1="68" y1="126" x2="104" y2="126"/>
    </g>
    <g stroke="#9aa3e6" stroke-width="4" stroke-linecap="round">
      <line x1="76" y1="70" x2="82" y2="70"/>
      <line x1="70" y1="82" x2="82" y2="82"/>
      <line x1="64" y1="94" x2="82" y2="94"/>
      <line x1="91" y1="70" x2="96" y2="70"/>
      <line x1="91" y1="82" x2="103" y2="82"/>
      <line x1="91" y1="94" x2="109" y2="94"/>
    </g>
  </g>
</svg>
